name: Daily News Auto-Update

on:
  schedule:
    # 매일 한국 시간 오전 7시 (영국 시간 전날 22:00) 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 우리가 원할 때 수동으로 바로 실행해볼 수 있는 버튼

permissions:
  contents: write # 로봇이 웹사이트(index.html) 파일을 덮어쓰고 저장할 수 있는 권한

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 내 저장소 파일들 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 도구 상자(라이브러리) 설치하기
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai

      - name: 파이썬 코드 실행하기 (크롤링 & HTML 생성)
        run: python main.py

      - name: 새로 만들어진 HTML 파일 저장하고 올리기
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🌱 매일 아침 뉴스 자동 업데이트" || echo "변경된 내용이 없습니다."
          git push
